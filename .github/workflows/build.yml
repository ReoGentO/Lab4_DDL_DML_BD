name: Build Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable with PyInstaller
        run: |
          pyinstaller main.spec --noconfirm --clean

      - name: Verify build output
        shell: pwsh
        run: |
          if (Test-Path "dist\main.exe") {
            $size = [math]::Round((Get-Item "dist\main.exe").Length / 1MB, 2)
            Write-Host "Build succeeded: dist\main.exe found ($size MB)"
          } else {
            Write-Error "dist\main.exe was not found after build!"
            exit 1
          }

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySQL-Manager-Windows-x64
          path: dist/main.exe
          if-no-files-found: error
          retention-days: 30

